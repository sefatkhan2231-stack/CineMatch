<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CineMatch logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="reelA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="reelB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="lensA"><circle cx="200" cy="256" r="118"/></clipPath>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" rx="112" fill="#0e0f1f"/>

  <!-- reel A (left) -->
  <circle cx="200" cy="256" r="118" fill="none" stroke="url(#reelA)" stroke-width="26"/>
  <circle cx="200" cy="256" r="84" fill="none" stroke="url(#reelA)" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="1 24" opacity="0.9"/>

  <!-- reel B (right) -->
  <circle cx="312" cy="256" r="118" fill="none" stroke="url(#reelB)" stroke-width="26"/>
  <circle cx="312" cy="256" r="84" fill="none" stroke="url(#reelB)" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="1 24" opacity="0.9"/>

  <!-- the "match": overlap lens glows, with a play button inside -->
  <g clip-path="url(#lensA)">
    <circle cx="312" cy="256" r="118" fill="#ffffff" fill-opacity="0.10"/>
  </g>
  <path d="M238 212 L238 300 L302 256 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
